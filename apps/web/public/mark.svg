<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">RiskTrace</title>
  <desc id="desc">Financial risk analysis icon with a shield, report, candlesticks, magnifier, rising arrow, coins and chain link.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1d33"/>
      <stop offset="1" stop-color="#10243d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a314f"/>
      <stop offset="1" stop-color="#0f2239"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47e4d8"/>
      <stop offset="1" stop-color="#20bfc2"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8299c4"/>
      <stop offset="1" stop-color="#526f9e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe17b"/>
      <stop offset="0.52" stop-color="#f5c14d"/>
      <stop offset="1" stop-color="#d79825"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.2" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="8.5" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M32 11.8 17.4 18.1v16.1c0 8.4 5.8 14.6 14.6 18 8.8-3.4 14.6-9.6 14.6-18V18.1L32 11.8Z"
        fill="none" stroke="#fff" stroke-width="1.35" stroke-linejoin="round"/>

  <!-- Report sheet -->
  <path d="M18.7 18.2h17.2l5.2 5.2v20.7H18.7Z" fill="url(#paper)"/>
  <path d="M35.9 18.2v4.2c0 .9.7 1.6 1.6 1.6h3.6Z" fill="#fff"/>

  <!-- Candlesticks -->
  <g stroke-linecap="round">
    <path d="M22.7 24.3v6.3" stroke="#7188b3" stroke-width=".45"/>
    <rect x="21.9" y="25.7" width="1.6" height="3.2" rx=".22" fill="url(#blue)"/>
    <path d="M25.8 21.6v6.4" stroke="#37d7cf" stroke-width=".45"/>
    <rect x="25.0" y="23.0" width="1.6" height="3.3" rx=".22" fill="url(#teal)"/>
    <path d="M28.9 24.4v6.0" stroke="#7188b3" stroke-width=".45"/>
    <rect x="28.1" y="25.7" width="1.6" height="3.2" rx=".22" fill="url(#blue)"/>
    <path d="M32.0 23.0v5.5" stroke="#37d7cf" stroke-width=".45"/>
    <rect x="31.2" y="24.5" width="1.6" height="2.9" rx=".22" fill="url(#teal)"/>
  </g>

  <!-- Report text lines -->
  <g fill="#617ba9">
    <rect x="21.8" y="32.5" width="7.6" height="1" rx=".5"/>
    <rect x="21.8" y="35.4" width="7.7" height="1" rx=".5"/>
    <rect x="21.8" y="38.3" width="6.4" height="1" rx=".5"/>
  </g>

  <!-- Magnifier lens -->
  <circle cx="38.7" cy="35.0" r="8.5" fill="#0b1d34" stroke="#fff" stroke-width="1.35"/>

  <!-- Rising chart -->
  <path d="m33.9 38.0 4.4-4.3 2.2 2.1 3.3-3.6" fill="none" stroke="url(#teal)" stroke-width=".9" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="m43.2 31.4 2.5-.25-.48 2.46Z" fill="#2bc8c7"/>

  <!-- Coins -->
  <g>
    <ellipse cx="38.0" cy="39.5" rx="3.7" ry="1.25" fill="#d69725"/>
    <rect x="34.3" y="38.7" width="7.4" height="1.2" fill="#e3a52a"/>
    <ellipse cx="38.0" cy="38.7" rx="3.7" ry="1.25" fill="url(#gold)" stroke="#c58a22" stroke-width=".22"/>

    <ellipse cx="40.2" cy="38.3" rx="3.7" ry="1.25" fill="#d69725"/>
    <rect x="36.5" y="37.2" width="7.4" height="1.15" fill="#e7a92d"/>
    <ellipse cx="40.2" cy="37.1" rx="3.7" ry="1.25" fill="url(#gold)" stroke="#c58a22" stroke-width=".22"/>
    <text x="40.2" y="37.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="2.5" font-weight="700" fill="#b47e21">$</text>
  </g>

  <!-- Magnifier handle -->
  <path d="M44.6 41.1 49.8 46.3" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
  <rect x="47.9" y="44.2" width="5.7" height="3.5" rx="1.5" transform="rotate(45 47.9 44.2)" fill="#fff"/>

  <!-- Chain link -->
  <g fill="none" stroke-linecap="round" stroke-width="1.15">
    <path d="M29.9 48.2h-1.7a2.1 2.1 0 0 0 0 4.2h2.2a2.1 2.1 0 0 0 1.7-.8" stroke="#fff"/>
    <path d="M34.1 48.2h1.7a2.1 2.1 0 0 1 0 4.2h-2.2a2.1 2.1 0 0 1-1.7-.8" stroke="url(#teal)"/>
    <path d="M29.8 50.3h4.4" stroke="#fff"/>
  </g>
</svg>
