name: risktrace

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-risktrace}
      POSTGRES_USER: ${POSTGRES_USER:-risktrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risktrace-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-risktrace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-risktrace-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${RISKTRACE_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-risktrace}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-risktrace-local-secret}
      RISKTRACE_S3_BUCKET: ${RISKTRACE_S3_BUCKET:-risktrace}

  api:
    build:
      context: ./apps/api
    environment:
      RISKTRACE_ENVIRONMENT: ${RISKTRACE_ENVIRONMENT:-development}
      RISKTRACE_LOG_LEVEL: ${RISKTRACE_LOG_LEVEL:-INFO}
      RISKTRACE_CORS_ORIGINS: http://localhost:3000
      RISKTRACE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-risktrace}:${POSTGRES_PASSWORD:-risktrace-local}@postgres:5432/${POSTGRES_DB:-risktrace}
      RISKTRACE_REDIS_URL: redis://redis:6379/0
      RISKTRACE_S3_ENDPOINT_URL: http://minio:9000
      RISKTRACE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-risktrace}
      RISKTRACE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-risktrace-local-secret}
      RISKTRACE_S3_BUCKET: ${RISKTRACE_S3_BUCKET:-risktrace}
    ports:
      - "8000:8000"
    command:
      - /bin/sh
      - -c
      - uv run --frozen --no-dev alembic -c alembic.ini upgrade head && exec uv run --frozen --no-dev uvicorn risktrace.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
    environment:
      RISKTRACE_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
